<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWarden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 4 7v8c0 7.5 5.1 13.1 12 15 6.9-1.9 12-7.5 12-15V7z' fill='%2338bdf8'/><path d='M10 17h3l2-5 3 9 2-4h2' stroke='%230b0f14' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.1 12 15 6.9-1.9 12-7.5 12-15V7z" fill="var(--down)"/><path d="M10 17h3l2-5 3 9 2-4h2" stroke="var(--bg)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>NetWarden</span>
  </div>
  <div id="status-pill" class="pill">Connecting…</div>
  <div class="spacer"></div>
  <div class="seg" role="tablist" aria-label="Interface mode">
    <button data-act="mode" data-mode="beginner" id="mode-beginner">Beginner</button>
    <button data-act="mode" data-mode="pro" id="mode-pro">Pro</button>
  </div>
</header>
<div id="notice"></div>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
